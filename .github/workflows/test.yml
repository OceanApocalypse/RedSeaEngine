name: Run tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "benchmarks/**"
      - "tests/**"
      - "**/*.csproj"
      - "**/*.slnx"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "benchmarks/**"
      - "tests/**"
      - "**/*.csproj"
      - "**/*.slnx"
  workflow_dispatch:

permissions:
  contents: read
  code-quality: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --framework net10.0 --configuration Release --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
        
      - name: Upload code coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: "**/TestResults/coverage.cobertura.xml"
          language: C#
          label: code-coverage/dotnet
